; Two firmware targets in one repo. Pick one with the env selector in the
; bottom bar of VS Code, or: pio run -e imu -t upload

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:blink]
build_src_filter = +<blink/>

[env:imu]
build_src_filter = +<imu/>

[env:i2cscan]
build_src_filter = +<i2cscan/>
